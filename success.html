<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="success-card">
            <div class="success-icon">
                <i class="fas fa-check-circle"></i>
            </div>
            <h2>Submitted Successfully!</h2>
            <p>Your details have been received. We'll get back to you soon.</p>
            <a href="index.html" class="close-btn">Return to Form</a>
            
            <div id="submittedData" class="submitted-data"></div>
        </div>
    </div>

    <script>
        // Display submitted data (optional)
        const formData = JSON.parse(sessionStorage.getItem('formData'));
        if (formData) {
            const dataContainer = document.getElementById('submittedData');
            let html = '<h3>Your Submission:</h3><ul>';
            
            for (const [key, value] of Object.entries(formData)) {
                if (value) {
                    html += `<li><strong>${key.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase())}:</strong> ${value}</li>`;
                }
            }
            
            html += '</ul>';
            dataContainer.innerHTML = html;
            sessionStorage.removeItem('formData');
        }
    </script>
</body>
</html>
